# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth tweaks
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Pairing limits: ZMK's split defaults (6 on the left half = 5 Bluetooth
# devices + the right half; 1 on the right half). Don't lower them: the left
# half needs one slot for the right half, so 3 would leave only 2 devices.

