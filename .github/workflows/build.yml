# Self-contained build workflow (based on urob/zmk@build-with-submodules, which
# has since been replaced upstream by a deprecation stub). Checks out git
# submodules (zmk-nodefree-config) and supports a per-entry `keymap` field in
# build.yaml so one shield can be built with several keymap variants.
name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  matrix:
    runs-on: ubuntu-latest
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Build Matrix
        id: matrix
        run: |
          matrix=$(python3 -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("build.yaml"))))')
          echo "build_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | jq

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.2
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Prepare variables
        shell: sh -x {0}
        run: |
          name="${{ matrix.board }}"
          args=""
          if [ -n "${{ matrix.shield }}" ]; then
            name="${{ matrix.shield }}-${name}"
            args="-DSHIELD=${{ matrix.shield }}"
          fi
          if [ -n "${{ matrix.keymap }}" ]; then
            name="${name}-${{ matrix.keymap }}"
            args="${args} -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/${{ matrix.keymap }}.keymap"
          fi
          echo "extra_cmake_args=${args}" >> $GITHUB_ENV
          echo "artifact_name=${name}-zmk" >> $GITHUB_ENV
          echo "display_name=${name}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-west-zephyr-3.2-${{ hashFiles('config/west.yml') }}
          restore-keys: ${{ runner.os }}-west-zephyr-3.2-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        shell: sh -x {0}
        run: west build -s zmk/app -b ${{ matrix.board }} -- -DZMK_CONFIG=${GITHUB_WORKSPACE}/config ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }}

      - name: ${{ env.display_name }} Kconfig file
        run: grep -v -e "^#" -e "^$" build/zephyr/.config | sort

      - name: Rename artifacts
        shell: sh -x {0}
        run: |
          mkdir build/artifacts
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 "build/artifacts/${{ env.artifact_name }}.uf2"
          elif [ -f build/zephyr/zmk.bin ]; then
            cp build/zephyr/zmk.bin "build/artifacts/${{ env.artifact_name }}.bin"
          fi

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: build/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          delete-merged: true
