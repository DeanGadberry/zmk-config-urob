# One-time job: copy the legacy firmware from build run 38586977391 (main @
# a20f41b, ZMK v0.3, with the Bluetooth pairing fix) into firmware/legacy/,
# so the legacy keymap no longer has to be built on every push.
# Delete this file once firmware/legacy/ exists.
name: Archive legacy firmware

on:
  push:
    paths:
      - ".github/workflows/archive-legacy.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware from build run 38586977391
        uses: actions/download-artifact@v8
        with:
          name: firmware
          run-id: 38586977391
          github-token: ${{ github.token }}
          path: downloaded

      - name: Commit the legacy firmware
        run: |
          mkdir -p firmware/legacy
          cp downloaded/*cradio_legacy*.uf2 firmware/legacy/
          ls -l firmware/legacy
          git add firmware/legacy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive legacy firmware (ZMK v0.3, build run 38586977391) [skip ci]"
          git push
