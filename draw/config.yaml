# keymap-drawer settings (https://github.com/caksoylar/keymap-drawer).
# Used by scripts/draw.sh and the "Draw keymaps" GitHub Action, which
# regenerate draw/*.svg whenever the keymaps change.
# Styling adapted from urob/zmk-config's draw/config.yaml.

parse_config:
  # Headers from the ZMK modules in config/west.yml (fetched by scripts/draw.sh).
  zmk_additional_includes:
    - modules/zmk/helpers/include
    - modules/zmk/auto-layer/dts
  trans_legend: { t: "", type: trans }

  # Exact binding text -> label (checked before keycode mapping).
  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&caps_word": Caps Word
    "&win_sleep": Sleep
    "&swapper": NWin
    "&kp LS(TAB)": PWin
    "&dot_spc": ". Spc ⇧"
    "&num_dance": { t: Smart Num }
    "&smart_shft": Smart-shift
    "&smart_num NUM 0": Smart-num
    "&lt_spc FN 0": { t: Spc, h: Fn }
    "&lt NAV RET": { t: Enter, h: Nav }
    "&kp K_CANCEL": Exit
    "&hml LA(LCTRL) TAB": Tab

    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4
    "&bt BT_CLR": BT Clear

    "&kp LC(INS)": Copy
    "&kp LC(X)": Cut
    "&kp LS(INS)": Paste

    "&hmr RSHFT LG(LC(LEFT))": { t: PDesk, h: Shift }
    "&hmr LALT LG(LC(RIGHT))": { t: NDesk, h: Alt }
    "&kp LG(LC(LS(A)))": PinA
    "&kp LG(LC(LS(Q)))": PinW
    "&kp LA(GRAVE)": Dsk

  # Nav-layer combos share keys with ( ) [ ]; their labels are set on those
  # combos below instead of drawing them twice.
  zmk_combos:
    combo_lt: { hidden: true }
    combo_gt: { hidden: true }
    combo_lbrc: { hidden: true }
    combo_rbrc: { hidden: true }
    combo_lpar: { key: { t: "( <" } }
    combo_rpar: { key: { t: ") >" } }
    combo_lbkt: { key: { t: "[ {" } }
    combo_rbkt: { key: { t: "] }" } }

  zmk_keycode_map:
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    LSHIFT: Shift

    BSPC: Bspc
    DEL: Del
    ESC: Esc
    RET: Enter
    RETURN: Enter
    SPACE: Spc
    TAB: Tab
    CAPSLOCK: Caps Lock
    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End
    UP: △
    DOWN: ▽
    LEFT: ◁
    RIGHT: ▷

    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_NEXT: $$mdi:skip-forward$$
    C_PREV: $$mdi:skip-backward$$

    AMPS: "&"
    AT: "@"
    BSLH: \
    CARET: ^
    COLON: ":"
    COMMA: ","
    DLLR: $
    DOT: .
    EQUAL: "="
    EXCL: "!"
    FSLH: /
    GRAVE: "`"
    GT: ">"
    HASH: "#"
    LBKT: "["
    LBRC: "{"
    LPAR: (
    LT: <
    MINUS: "-"
    PIPE: "|"
    PLUS: +
    PRCNT: "%"
    QMARK: "?"
    RBKT: "]"
    RBRC: "}"
    RPAR: )
    SEMICOLON: ;
    SQT: "'"
    STAR: "*"
    TILDE: "~"
    UNDER: _

# Look of the original keymap image (urob's gruvbox colors, dark keys).
draw_config:
  append_colon_to_layer_header: false
  dark_mode: false
  key_w: 60  # key size of the original image
  key_h: 60
  footer_text: "deangadberry/zmk-config-urob"
  glyph_tap_size: 15
  glyph_hold_size: 12
  glyph_shifted_size: 10
  legend_rel_y: 1
  outer_pad_w: 10
  outer_pad_h: 10
  small_pad: 4

  svg_style: |
    svg path { fill: inherit; }

    svg.keymap {
        --color-bg:      #a89984;
        --color-key:     #282828;
        --color-text:    #ebdbb2;
        --color-ghost:   #928374;
        --color-dendron: #504945;
        --color-held:    #665c54;

        --color-fn:      #458588;
        --color-nav:     #fabd2f;
        --color-num:     #d65d0e;
        --color-sys:     #689d6a;

        fill: var(--color-text);
        background-color: var(--color-bg);
        font-family: Calibri, system-ui, sans-serif;
        font-size: 16px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.02em;
    }

    text.tap     { font-weight: 500; }
    text.hold    { font-weight: 400; font-size: 13px; }
    text.shifted { font-weight: 400; font-size: 11px; }
    text.combo, text.left, text.right, text.tl, text.tr, text.bl, text.br { font-size: 10px; }

    text.hold, text.bl, text.br    { text-anchor: middle; dominant-baseline: auto; }
    text.shifted, text.tl, text.tr { text-anchor: middle; dominant-baseline: hanging; }
    text.left, text.tl, text.bl    { text-anchor: start; }
    text.right, text.tr, text.br   { text-anchor: end; }

    text.layer-activator { text-decoration: underline; }
    text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right { font-size: 8px; }

    text.label, text.footer {
        fill: var(--color-key);
        stroke: var(--color-bg);
        stroke-width: 4;
        paint-order: stroke;
    }
    text.label  { font-weight: bold; text-anchor: start; }
    text.footer { text-anchor: end; dominant-baseline: auto; }

    rect.key, rect.combo, rect.combo-separate { fill: var(--color-key); stroke-width: 0; }
    rect.held, rect.combo.held                { fill: var(--color-held); }
    .layer-Combos rect.key                    { fill: var(--color-ghost); }

    path.combo { stroke: var(--color-dendron); stroke-width: 2; stroke-dasharray: 2, 3; opacity: 0.45; fill: none; }

    text.tl, use.tl { fill: var(--color-fn); }
    text.tr, use.tr { fill: var(--color-nav); }
    text.bl, use.bl { fill: var(--color-num); }
    text.br, use.br { fill: var(--color-sys); }

    .keypos-30 text.hold { fill: var(--color-nav); }
    .keypos-31 text.hold { fill: var(--color-fn); }
    .keypos-32 text.hold { fill: var(--color-num); font-size: 15px; }
    .keypos-32 text.tap  { fill: var(--color-num); }
    .keypos-33 text.hold { font-size: 15px; }
    .keypos-32 text.tap, .keypos-33 text.tap { font-size: 14px; }
    text.footer { font-size: 12px; }
