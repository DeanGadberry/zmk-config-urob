# This file generates the GitHub Actions matrix.
#
# Each entry builds one firmware file. Optional fields:
#   keymap:     name of a .keymap file in config/ (without extension) to use
#               instead of the default <shield>.keymap
#   cmake-args: extra arguments passed to cmake
#
# The default keymap is config/cradio.keymap (-> base.keymap).
# The "alt" variant is config/cradio_alt.keymap (-> alt.keymap).
---
include:
  # default keymap
  - board: nice_nano_v2
    shield: cradio_left
  - board: nice_nano_v2
    shield: cradio_right

  # alternate keymap variant
  - board: nice_nano_v2
    shield: cradio_left
    keymap: cradio_alt
  - board: nice_nano_v2
    shield: cradio_right
    keymap: cradio_alt
